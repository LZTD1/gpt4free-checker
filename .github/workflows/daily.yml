name: Daily Provider Model Testing

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg flac

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Monitor resources before testing
      run: |
        echo "Memory usage:"
        free -m
        echo "Disk usage:"
        df -h

    - name: Clean filesystem before work
      run: rm -rf reports.tmp/ || true

    - name: Run provider testing
      run: |
        python -m providers_tester \
          --reports-dir reports \
          --prev-summary reports/summary.json \
          --concurrency 10 \
          --timeout 45 \
          --retries 2 \
          --inter-model-pause 1.5 \
          --inter-model-pause-jitter 1.0

    - name: Commit and push new results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add reports/
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Daily provider test results - $(date '+%Y-%m-%d %H:%M UTC')"
          git push
        else
          echo "No changes to commit"
        fi
